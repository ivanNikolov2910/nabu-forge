[project]
name = "nabu-forge"
version = "0.1.0"
description = "A schema-driven compiler that transforms GraphQL SDL and operation definitions into type-safe Python client packages."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
]

[project.scripts]
nabu = "nabu.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nabu"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.4",
]