[project]
name = "nabu-forge"
version = "1.0.0"
description = "A schema-driven compiler that transforms GraphQL SDL and operation definitions into type-safe Python client packages."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Ivan Nikolov"}]
dependencies = [
    "typer>=0.27.1",
    "graphql-core>=3.2",
    "jinja2>=3.1.6",
    "pydantic>=2.0",
    "httpx>=0.26.2"
]

[project.urls]
Repository = "https://github.com/ivanNikolov2910/nabu-forge"

[project.scripts]
nabu = "nabu.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nabu"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1"
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1"
]