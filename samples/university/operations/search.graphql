query Search($query: String!) {
    search(query: $query) {
        ... on UndergraduateStudent {
            id
            name
            email
            status
            major
        }
        ... on GraduateStudent {
            id
            name
            email
            status
            department
            thesisTitle
        }
        ... on Course {
            id
            code
            title
            credits
            status
        }
        ... on Instructor {
            id
            name
            email
            department
        }
    }
}
